[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turboedit"
version = "0.1.0"
description = "Implementation of TurboEdit algorithm for GNSS data"
authors = [{ name="Matheus Maica", email="matheus.maica@unb.ca" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7"

[tool.setuptools]
packages = ["turboedit"]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.package-data]
turboedit = ["../lib/*.dll"]  # Include the DLL